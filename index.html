<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RRB NTPC Simulator</title>
  <style>
    body { background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; padding: 20px; line-height: 1.6; }
    .container { max-width: 600px; margin: auto; }
    .card { background: #161b22; padding: 20px; border-radius: 10px; border: 1px solid #30363d; margin-bottom: 20px; }
    button { display: block; width: 100%; padding: 15px; margin: 10px 0; background: #21262d; color: #c9d1d9; border: 1px solid #30363d; border-radius: 5px; cursor: pointer; text-align: left; font-size: 16px; transition: background 0.2s; }
    button:hover:not(:disabled) { background: #30363d; }
    button:disabled { cursor: default; opacity: 0.9; }
    .correct { background: #238636 !important; color: white !important; border-color: #2ea043 !important; }
    .incorrect { background: #da3633 !important; color: white !important; border-color: #f85149 !important; }
    .hidden { display: none; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
    #stats-text { color: #8b949e; font-size: 0.9em; font-weight: bold; }
    .controls { display: flex; gap: 8px; align-items: center; }
    #jump-input { width: 50px; padding: 5px; background: #0d1117; color: #c9d1d9; border: 1px solid #30363d; border-radius: 4px; text-align: center; font-size: 13px; }
    .header-btn { width: auto; padding: 5px 12px; margin: 0; font-size: 12px; background: #21262d; border-color: #30363d; }
    #jump-btn:hover { background: #1f6feb; border-color: #388bfd; }
    #reset-btn:hover { background: #da3633; border-color: #f85149; }
    #question-text { font-size: 1.1em; white-space: pre-wrap; margin-bottom: 20px; }
    #explanation-text { white-space: pre-wrap; line-height: 1.8; color: #c9d1d9; font-size: 0.95em; }
    #explanation-card h4 { margin-top: 0; color: #58a6ff; font-size: 1.1em; }
    #next-btn { text-align: center; background: #1f6feb; border-color: #388bfd; font-weight: bold; margin-top: 20px; }
    #next-btn:hover { background: #388bfd; }
  </style>
</head>
<body>
  <div class="container">
    <h2 style="text-align: center; color: #58a6ff;">RRB NTPC Simulator</h2>
    <div id="loading" style="text-align: center; color: #8b949e;">Connecting to databank...</div>
    
    <div id="quiz" class="hidden">
        <div class="card">
            <div class="header-bar">
                <div id="stats-text">Score: 0.00 | Q: 1</div>
                <div class="controls">
                    <input type="number" id="jump-input" min="1" placeholder="Q#">
                    <button id="jump-btn" class="header-btn">Go</button>
                    <button id="reset-btn" class="header-btn">Reset</button>
                </div>
            </div>
            <div id="question-text"></div>
            <div id="options"></div>
        </div>
        
        <div id="explanation-card" class="card hidden">
            <h4>Explanation:</h4>
            <div id="explanation-text"></div>
            <button id="next-btn">Next Question</button>
        </div>
    </div>
  </div>

  <script>
    let questions = [];
    let currentQIndex = 0;
    let score = 0;

    function saveState() {
        localStorage.setItem('rrb_ntpc_state', JSON.stringify({
            index: currentQIndex,
            score: score
        }));
    }

    function loadState() {
        const saved = localStorage.getItem('rrb_ntpc_state');
        if (saved) {
            const parsed = JSON.parse(saved);
            currentQIndex = parsed.index;
            score = parsed.score;
        }
    }

    document.getElementById('reset-btn').onclick = () => {
        if (confirm("Are you sure you want to wipe your progress and start over?")) {
            localStorage.removeItem('rrb_ntpc_state');
            location.reload();
        }
    };

    document.getElementById('jump-btn').onclick = () => {
        const targetQ = parseInt(document.getElementById('jump-input').value);
        if (!isNaN(targetQ) && targetQ >= 1 && targetQ <= questions.length) {
            currentQIndex = targetQ - 1;
            saveState();
            loadQuestion();
            document.getElementById('jump-input').value = '';
        } else {
            alert(`Please enter a valid question number between 1 and ${questions.length}.`);
        }
    };

    function parseCSV(str) {
        const arr = []; let quote = false; let row = []; let col = '';
        for (let c = 0; c < str.length; c++) {
            let cc = str[c], nc = str[c+1];
            if (cc === '"' && quote && nc === '"') { col += cc; ++c; continue; }
            if (cc === '"') { quote = !quote; continue; }
            if (cc === ',' && !quote) { row.push(col); col = ''; continue; }
            if (cc === '\n' && !quote) { row.push(col); arr.push(row); col = ''; row = []; continue; }
            if (cc === '\r' && !quote) { continue; } 
            col += cc;
        }
        if (col) row.push(col);
        if (row.length) arr.push(row);
        return arr;
    }

    async function init() {
        try {
            const response = await fetch('RRB_NTPC_Detailed_4500_Question_Bank.csv');
            if (!response.ok) throw new Error("Database file not found");
            const text = await response.text();
            const data = parseCSV(text);
            
            questions = data.slice(1).filter(r => r.length >= 9);
            
            loadState(); 
            
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('quiz').classList.remove('hidden');
            
            if (currentQIndex >= questions.length) {
                document.getElementById('quiz').innerHTML = `<h3 style="text-align:center; color:#2ea043;">Simulation Complete</h3><p style="text-align:center;">Final Score: ${score.toFixed(2)} / ${questions.length}</p><button onclick="localStorage.removeItem('rrb_ntpc_state'); location.reload();">Restart Engine</button>`;
            } else {
                loadQuestion();
            }
        } catch (err) {
            document.getElementById('loading').innerText = 'System Error: Could not load RRB_NTPC_Detailed_4500_Question_Bank.csv. Verify the file exists in the repository root.';
            document.getElementById('loading').style.color = '#f85149';
        }
    }

    function loadQuestion() {
        const q = questions[currentQIndex];
        document.getElementById('stats-text').innerText = `Score: ${score.toFixed(2)} | Q: ${currentQIndex + 1} / ${questions.length}`;
        
        document.getElementById('question-text').innerHTML = `<span style="color:#8b949e; font-size:0.85em; text-transform:uppercase; letter-spacing:1px;">[${q[0]} - ${q[1]}]</span><br><br>${q[2]}`;
        
        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = '';
        
        const options = [q[3], q[4], q[5], q[6]];
        options.sort(() => Math.random() - 0.5); 
        
        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(btn, opt, q[7], q[8]);
            optionsDiv.appendChild(btn);
        });
        
        document.getElementById('explanation-card').classList.add('hidden');
    }

    function checkAnswer(btn, selected, correct, explanation) {
        const buttons = document.getElementById('options').querySelectorAll('button');
        buttons.forEach(b => b.disabled = true); 
        
        if (selected.trim() === correct.trim()) {
            btn.classList.add('correct');
            score += 1;
        } else {
            btn.classList.add('incorrect');
            score -= 0.333;
            buttons.forEach(b => { if(b.innerText.trim() === correct.trim()) b.classList.add('correct'); });
        }
        
        saveState();
        
        document.getElementById('explanation-text').innerText = explanation;
        document.getElementById('explanation-card').classList.remove('hidden');
        document.getElementById('stats-text').innerText = `Score: ${score.toFixed(2)} | Q: ${currentQIndex + 1} / ${questions.length}`;
    }

    document.getElementById('next-btn').onclick = () => {
        currentQIndex++;
        saveState();
        
        if (currentQIndex < questions.length) {
            loadQuestion();
        } else {
            document.getElementById('quiz').innerHTML = `<h3 style="text-align:center; color:#2ea043;">Simulation Complete</h3><p style="text-align:center;">Final Score: ${score.toFixed(2)} / ${questions.length}</p><button onclick="localStorage.removeItem('rrb_ntpc_state'); location.reload();">Restart Engine</button>`;
        }
    };

    init();
  </script>
</body>
</html>
