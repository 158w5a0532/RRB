<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RRB NTPC Simulator</title>
  <style>
    body { background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; padding: 20px; line-height: 1.6; }
    .container { max-width: 600px; margin: auto; }
    .card { background: #161b22; padding: 20px; border-radius: 10px; border: 1px solid #30363d; margin-bottom: 20px; }
    button { display: block; width: 100%; padding: 15px; margin: 10px 0; background: #21262d; color: #c9d1d9; border: 1px solid #30363d; border-radius: 5px; cursor: pointer; text-align: left; font-size: 16px; }
    button:hover:not(:disabled) { background: #30363d; }
    button:disabled { cursor: default; }
    .correct { background: #238636 !important; color: white !important; border-color: #2ea043 !important; }
    .incorrect { background: #da3633 !important; color: white !important; border-color: #f85149 !important; }
    .hidden { display: none; }
    #stats { color: #8b949e; font-size: 0.9em; margin-bottom: 15px; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>RRB NTPC Simulator</h2>
    <div id="loading">Connecting to databank...</div>
    <div id="quiz" class="hidden">
        <div class="card">
            <div id="stats">Score: 0 | Question: 1</div>
            <h3 id="question-text"></h3>
            <div id="options"></div>
        </div>
        <div id="explanation-card" class="card hidden">
            <h4 style="margin-top:0; color:#58a6ff;">Explanation:</h4>
            <p id="explanation-text"></p>
            <button id="next-btn" style="text-align:center; background:#1f6feb; border-color:#388bfd;">Next Question</button>
        </div>
    </div>
  </div>

  <script>
    let questions = [];
    let currentQIndex = 0;
    let score = 0;

    // Robust CSV Parser to handle commas inside the question text
    function parseCSV(str) {
        const arr = []; let quote = false; let row = []; let col = '';
        for (let c = 0; c < str.length; c++) {
            let cc = str[c], nc = str[c+1];
            if (cc == '"' && quote && nc == '"') { col += cc; ++c; continue; }
            if (cc == '"') { quote = !quote; continue; }
            if (cc == ',' && !quote) { row.push(col); col = ''; continue; }
            if (cc == '\n' && !quote) { row.push(col); arr.push(row); col = ''; row = []; continue; }
            if (cc == '\r' && !quote) { continue; } // Ignore carriage returns
            col += cc;
        }
        if (col) row.push(col);
        if (row.length) arr.push(row);
        return arr;
    }

    async function init() {
        try {
            // Automatically fetches the CSV hosted in the same GitHub repository
            const response = await fetch('RRB_NTPC_4500_Question_Bank.csv');
            if (!response.ok) throw new Error("File not found");
            const text = await response.text();
            const data = parseCSV(text);
            
            // Map to the 9 columns: Skip header (row 0) and ignore empty rows
            questions = data.slice(1).filter(r => r.length >= 9);
            questions.sort(() => Math.random() - 0.5); // Randomize question order
            
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('quiz').classList.remove('hidden');
            loadQuestion();
        } catch (err) {
            document.getElementById('loading').innerText = 'Error: Could not load RRB_NTPC_4500_Question_Bank.csv. Ensure it is uploaded to the repository.';
        }
    }

    function loadQuestion() {
        const q = questions[currentQIndex];
        document.getElementById('stats').innerText = `Score: ${score.toFixed(2)} | Question: ${currentQIndex + 1} of ${questions.length}`;
        
        // Maps to Index 2 (Question), prefixed with Index 0 & 1 (Subject/Topic)
        document.getElementById('question-text').innerText = `[${q[0]} - ${q[1]}]\n\n${q[2]}`;
        
        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = '';
        
        // Maps to Indices 3, 4, 5, 6 (Options)
        const options = [q[3], q[4], q[5], q[6]];
        options.sort(() => Math.random() - 0.5); // Randomize option positions
        
        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.innerText = opt;
            // q[7] is Correct Answer, q[8] is Explanation
            btn.onclick = () => checkAnswer(btn, opt, q[7], q[8]);
            optionsDiv.appendChild(btn);
        });
        
        document.getElementById('explanation-card').classList.add('hidden');
    }

    function checkAnswer(btn, selected, correct, explanation) {
        const buttons = document.getElementById('options').querySelectorAll('button');
        buttons.forEach(b => b.disabled = true); 
        
        if (selected === correct) {
            btn.classList.add('correct');
            score += 1; // +1 Mark
        } else {
            btn.classList.add('incorrect');
            score -= 0.33; // -1/3 Negative Marking
            buttons.forEach(b => { if(b.innerText === correct) b.classList.add('correct'); });
        }
        
        document.getElementById('explanation-text').innerText = explanation;
        document.getElementById('explanation-card').classList.remove('hidden');
        document.getElementById('stats').innerText = `Score: ${score.toFixed(2)} | Question: ${currentQIndex + 1} of ${questions.length}`;
    }

    document.getElementById('next-btn').onclick = () => {
        currentQIndex++;
        if (currentQIndex < questions.length) {
            loadQuestion();
        } else {
            document.getElementById('quiz').innerHTML = `<h3>Quiz Complete! Final Score: ${score.toFixed(2)}</h3>`;
        }
    };

    init();
  </script>
</body>
</html>
